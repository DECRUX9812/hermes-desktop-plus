services:
  hermes-plus:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Official Hermes Agent release tag to build on.
        HERMES_TAG: ${HERMES_TAG:-v0.22.1}
    image: hermes-desktop-plus:latest
    container_name: hermes-plus
    ports:
      - "127.0.0.1:9129:9129"
    volumes:
      # The official image's HERMES_HOME. Everything Hermes and hermes-plus
      # write (config, profiles, plus.db, uploads) lives here.
      - hermes-data:/opt/data
    environment:
      # The base image remaps its `hermes` user to these ids at boot so files
      # in the volume match the host user. Defaults to the image's own 10000.
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      - HERMES_PLUS_AUTH=${HERMES_PLUS_AUTH:-password}
      - HERMES_PLUS_PASSWORD=${HERMES_PLUS_PASSWORD:-}
      - HERMES_PLUS_TRUST_PROXY_HEADERS=${HERMES_PLUS_TRUST_PROXY_HEADERS:-0}
      # Origins other than the sidecar's own that may drive it (the sidecar
      # refuses a browser Origin that does not match its Host). Leave empty for
      # a browser at the published address; see docs/security.md.
      - HERMES_PLUS_ALLOWED_ORIGINS=${HERMES_PLUS_ALLOWED_ORIGINS:-}
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: hermes-plus-tunnel
    profiles:
      - tunnel
    restart: unless-stopped
    # In Cloudflare Zero Trust dashboard, create a tunnel and add a public hostname
    # with service origin: http://hermes-plus:9129
    # When routing via Cloudflare Tunnel, set HERMES_PLUS_TRUST_PROXY_HEADERS=1
    # on the hermes-plus service to trust incoming proxy headers, and make sure
    # the tunnel forwards X-Forwarded-Host: the sidecar refuses a browser Origin
    # that does not match its own host. See docs/security.md.
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}
    depends_on:
      - hermes-plus
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}

volumes:
  hermes-data:
