[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hermes-plus"
version = "0.2.0"
description = "Hermes Desktop Plus: the desktop/web app add-on for stock Hermes Agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Hermes Desktop Plus contributors" }]
keywords = ["hermes", "hermes-agent", "desktop", "web-ui", "sidecar"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
  "websockets>=13,<16",
  "pyyaml>=6,<7",
  "starlette>=0.37,<1",
  "uvicorn>=0.31,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<0.1",
  "ptyprocess>=0.7,<1; sys_platform != 'win32'",
  "mcp>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/DECRUX9812/hermes-desktop-plus"
Repository = "https://github.com/DECRUX9812/hermes-desktop-plus"
Issues = "https://github.com/DECRUX9812/hermes-desktop-plus/issues"
Changelog = "https://github.com/DECRUX9812/hermes-desktop-plus/releases"

[project.scripts]
hermes-plus = "hermes_plus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_plus"]
# The UI bundle enters the wheel exclusively via the custom hook's
# force_include; hatchling can't see that it's gitignored (the rule lives in
# the repo-root .gitignore, above this project), so exclude it from normal
# selection to avoid adding every file twice.
exclude = ["src/hermes_plus/ui_dist"]
include = [
  { path = "src/hermes_plus/bridge/**/*.yaml", from = "src/hermes_plus" },
  { path = "src/hermes_plus/bridge/**/*.json", from = "src/hermes_plus" },
  { path = "src/hermes_plus/extras/**/*.yaml", from = "src/hermes_plus" },
  { path = "src/hermes_plus/extras/**/*.md", from = "src/hermes_plus" },
  { path = "src/hermes_plus/extras/**/*.json", from = "src/hermes_plus" },
  { path = "src/hermes_plus/extras/**/*.png", from = "src/hermes_plus" },
  { path = "src/hermes_plus/extras/**/*.jpg", from = "src/hermes_plus" },
  { path = "src/hermes_plus/extras/**/*.js", from = "src/hermes_plus" },
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "contract: runs the adapter against a real stock Hermes install (HERMES_PLUS_TEST_HERMES)",
  "integration: starts real processes",
  "model: calls a real model provider (HERMES_PLUS_TEST_MODEL_CONFIG must name a config.yaml)",
]
