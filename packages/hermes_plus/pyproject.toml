[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hermes-plus"
version = "0.1.0"
description = "Hermes Desktop Plus: the desktop/web app add-on for stock Hermes Agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "websockets>=13,<16",
  "pyyaml>=6",
  "starlette>=0.37,<1",
  "uvicorn>=0.31,<1",
  "httpx>=0.27,<1",
  "ptyprocess>=0.7; sys_platform != 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
hermes-plus = "hermes_plus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_plus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "contract: runs the adapter against a real stock Hermes install (HERMES_PLUS_TEST_HERMES)",
  "integration: starts real processes",
  "model: calls a real model provider (HERMES_PLUS_TEST_MODEL_CONFIG must name a config.yaml)",
]
