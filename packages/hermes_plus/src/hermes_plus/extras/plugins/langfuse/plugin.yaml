name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for Hermes — traces conversations, LLM calls, and tool usage. Opt-in via `hermes plugins enable langfuse` or `hermes tools → Langfuse Observability`."
author: NousResearch
requires_env:
  - HERMES_LANGFUSE_PUBLIC_KEY
  - HERMES_LANGFUSE_SECRET_KEY
config_schema:
  public_key:
    type: secret
    env: HERMES_LANGFUSE_PUBLIC_KEY
    description: "Langfuse public key (pk-lf-...); stored in .env, read through the profile secret scope."
  secret_key:
    type: secret
    env: HERMES_LANGFUSE_SECRET_KEY
    description: "Langfuse secret key (sk-lf-...); stored in .env, read through the profile secret scope."
provides_hooks:
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
  - on_session_finalize
  - on_session_end
  - subagent_start
  - subagent_stop
